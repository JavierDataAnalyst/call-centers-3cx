name: Ingest 3CX CSVs to Supabase

on:
  push:
    paths:
      - "data/incoming/**"

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run ingestion script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/ingest.py

      - name: Move processed files to archive
        run: |
          mkdir -p data/processed
          mv data/incoming/*.csv data/processed/ 2>/dev/null || true

      - name: Commit archived files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: archive processed CSVs [skip ci]"
          git push
